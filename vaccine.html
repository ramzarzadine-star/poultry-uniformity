<h1>
مرکز تخصصی سلامت طیور آدینه

<button class="logout" data-logout>

</button>

<nav class="menu">

<main class="container">


<div class="card">

<h2>
ثبت واکسیناسیون
</h2>


<select id="flockId"></select>


<div class="form-grid">

<input
id="name"
placeholder="نام واکسن / بیماری"
>

<input
id="age"
type="number"
placeholder="سن (روز)"
>

<input
id="date"
type="date"
>

<select id="method">

<option value="">
روش مصرف
</option>

<option>
آب آشامیدنی
</option>

<option>
اسپری
</option>

<option>
قطره چشمی / بینی
</option>

<option>
تزریق
</option>

<option>
سایر
</option>

</select>


<input
id="manufacturer"
placeholder="شرکت / سازنده"
>


<input
id="batch"
placeholder="شماره بچ / سری ساخت"
>


<input
id="notes"
placeholder="یادداشت"
>

</div>


<div class="actions">

<button onclick="saveVaccine()">
ثبت
</button>

</div>

</div>


<div class="card">

<h2>
سوابق واکسیناسیون
</h2>

<div id="list"></div>

</div>


</main>


<script src="database.js"></script>

<script src="app.js"></script>


<script>

function render(){

fillFlockSelect("flockId");

const data=
read("vaccine",[])
.slice()
.reverse();


const list=
document.getElementById("list");


if(!data.length){

list.innerHTML=
"هنوز واکسنی ثبت نشده است.";

return;

}


list.innerHTML=data.map(

function(item){

return `

<div class="list-item">

💉

<b>
${escapeHTML(item.name)}
</b>


<div class="meta">

سن:
${fmt(item.age,0)}
روز

|

${escapeHTML(item.date)}

|

${escapeHTML(item.method)}

|

${escapeHTML(item.manufacturer || "")}

</div>


<div>

بچ:
${escapeHTML(item.batch || "-")}

</div>


<div>

${escapeHTML(item.notes || "")}

</div>

</div>

`;

}

).join("");

}


function saveVaccine(){

if(!requireUser()){

return;

}


const flockId=
document.getElementById("flockId").value;


const name=
document.getElementById("name").value.trim();


if(!flockId || !name){

alert(
"گله و نام واکسن الزامی است."
);

return;

}


addRecord(

"vaccine",

{

flockId:flockId,

name:name,

age:
num(document.getElementById("age").value),

date:
document.getElementById("date").value ||
todayISO(),

method:
document.getElementById("method").value,

manufacturer:
document.getElementById("manufacturer").value.trim(),

batch:
document.getElementById("batch").value.trim(),

notes:
document.getElementById("notes").value.trim()

}

);


render();

}


document.addEventListener(

"DOMContentLoaded",

function(){

document.getElementById("date").value=todayISO();

render();

}

);

</script>

</body>

</html>
