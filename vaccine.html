<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<link rel="stylesheet" href="Style.css">

<title>
واکسیناسیون
</title>

</head>


<body>


<header class="header">

<h1>
💉 برنامه واکسیناسیون
</h1>

<div id="userBox"></div>

</header>




<div class="container">


<div class="card">


<input id="vaccineName" placeholder="نام واکسن">


<input id="vaccineAge" placeholder="سن مصرف">


<input id="vaccineDate" type="date">


<input id="vaccineMethod" placeholder="روش مصرف">


<button onclick="saveVaccine()">

ثبت واکسن

</button>


</div>





<div class="card">


<h2>
سوابق واکسن
</h2>


<div id="vaccineList"></div>


</div>


</div>




<script src="database.js"></script>


<script>


function saveVaccine(){


let data={


name:vaccineName.value,


age:vaccineAge.value,


date:vaccineDate.value,


method:vaccineMethod.value


};



saveRecord(

"vaccine",

data

);



showVaccine();


}






function showVaccine(){


let data=loadRecords("vaccine");


let html="";



data.forEach(function(x){


html+=`

<div class="card">


💉 ${x.name}

<br>

سن: ${x.age}

<br>

تاریخ: ${x.date}

<br>

روش: ${x.method}


</div>


`;



});



document.getElementById("vaccineList").innerHTML=html;


}






window.onload=function(){

showVaccine();

};


</script>



</body>

</html>
