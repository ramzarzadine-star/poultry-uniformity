<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#176b54"
  >

  <title>
    تغییر رمز عبور | مرکز تخصصی سلامت طیور آدینه
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      min-height: 100%;
    }


    body {

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 18px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #05271f,
          #0c4738,
          #041a15
        );

    }


    .card {

      width: 100%;

      max-width: 430px;

      background: white;

      border-radius: 26px;

      padding: 30px 24px;

      box-shadow:
        0 25px 70px
        rgba(0,0,0,.35);

    }


    .logo {

      width: 82px;

      height: 82px;

      object-fit: contain;

      display: block;

      margin:
        0 auto 18px;

    }


    h1 {

      text-align: center;

      margin: 0;

      color: #173b32;

      font-size: 24px;

    }


    .subtitle {

      text-align: center;

      color: #718079;

      font-size: 13px;

      line-height: 1.9;

      margin:
        9px 0 24px;

    }


    .field {

      margin-bottom: 16px;

    }


    label {

      display: block;

      margin-bottom: 7px;

      color: #344840;

      font-size: 13px;

      font-weight: 700;

    }


    input {

      width: 100%;

      height: 52px;

      border:
        1px solid #d5dfdb;

      border-radius: 12px;

      padding:
        0 14px;

      direction: ltr;

      text-align: left;

      font-size: 16px;

      outline: none;

    }


    input:focus {

      border-color: #176b54;

      box-shadow:
        0 0 0 3px
        rgba(23,107,84,.12);

    }


    button {

      width: 100%;

      height: 53px;

      border: 0;

      border-radius: 13px;

      background: #176b54;

      color: white;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

    }


    button:disabled {

      opacity: .55;

      cursor: not-allowed;

    }


    .message {

      display: none;

      margin-top: 16px;

      padding: 12px;

      border-radius: 11px;

      text-align: center;

      font-size: 13px;

      line-height: 1.8;

    }


    .message.show {

      display: block;

    }


    .message.error {

      background: #fff0f0;

      color: #9c2222;

    }


    .message.success {

      background: #eaf8f1;

      color: #176b54;

    }


    .loading {

      display: none;

      text-align: center;

      margin-top: 13px;

      color: #718079;

      font-size: 12px;

    }


    .loading.show {

      display: block;

    }


    .footer {

      text-align: center;

      margin-top: 22px;

      color: #8b9792;

      font-size: 11px;

    }

  </style>

</head>


<body>

  <main class="card">


    <img
      class="logo"
      src="IMG_4309.png"
      alt="مرکز تخصصی سلامت طیور آدینه"
    >


    <h1>
      تغییر رمز عبور
    </h1>


    <div class="subtitle">

      رمز عبور جدید خود را وارد کنید.

      <br>

      پس از ذخیره، به سامانه بازگردانده می‌شوید.

    </div>


    <form
      id="resetPasswordForm"
    >


      <div class="field">

        <label for="newPassword">
          رمز عبور جدید
        </label>

        <input
          id="newPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
          placeholder="حداقل ۸ کاراکتر"
        >

      </div>


      <div class="field">

        <label for="confirmPassword">
          تکرار رمز عبور جدید
        </label>

        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
          placeholder="رمز عبور را دوباره وارد کنید"
        >

      </div>


      <button
        id="savePasswordBtn"
        type="submit"
      >
        ذخیره رمز عبور جدید
      </button>


    </form>


    <div
      id="loading"
      class="loading"
    >
      در حال ذخیره رمز عبور...
    </div>


    <div
      id="message"
      class="message"
      role="alert"
    ></div>


    <div class="footer">
      مرکز تخصصی سلامت طیور آدینه
    </div>


  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
  ></script>

  <script src="supabase.js"></script>

  <script src="reset-password.js"></script>

</body>

</html>
