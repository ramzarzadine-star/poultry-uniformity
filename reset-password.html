`
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <title>
    تغییر رمز عبور | مرکز تخصصی سلامت طیور آدینه
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }


    body {

      font-family:
        Tahoma,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f7f8fa 0%,
          #eef1f4 100%
        );

      color: #172033;

      display: flex;

      align-items: center;

      justify-content: center;

      min-height: 100vh;

      padding: 20px;

    }


    .page {

      width: 100%;

      max-width: 460px;

    }


    .card {

      background: #ffffff;

      border-radius: 20px;

      padding: 34px 30px 30px;

      box-shadow:
        0 15px 45px
        rgba(0, 0, 0, 0.08);

      border:
        1px solid
        rgba(20, 35, 60, 0.08);

    }


    .logo {

      width: 74px;

      height: 74px;

      margin:
        0 auto 18px;

      border-radius: 18px;

      background: #172b4d;

      display: flex;

      align-items: center;

      justify-content: center;

      color: #d4af37;

      font-size: 28px;

      font-weight: bold;

    }


    h1 {

      margin:
        0 0 10px;

      text-align: center;

      color: #172b4d;

      font-size: 25px;

      font-weight: 700;

    }


    .subtitle {

      margin:
        0 0 28px;

      text-align: center;

      color: #697386;

      font-size: 14px;

      line-height: 1.9;

    }


    .gold-line {

      width: 55px;

      height: 3px;

      background: #d4af37;

      border-radius: 10px;

      margin:
        0 auto 25px;

    }


    .field {

      margin-bottom: 18px;

    }


    label {

      display: block;

      margin-bottom: 8px;

      font-size: 14px;

      font-weight: 600;

      color: #27364d;

    }


    input {

      width: 100%;

      height: 52px;

      border-radius: 12px;

      border:
        1px solid
        #d9dee7;

      background: #fafbfc;

      padding:
        0 15px;

      font-size: 16px;

      color: #172033;

      outline: none;

      transition:
        border-color .2s,
        box-shadow .2s,
        background .2s;

      direction: ltr;

      text-align: left;

    }


    input:focus {

      border-color: #172b4d;

      background: #ffffff;

      box-shadow:
        0 0 0 3px
        rgba(23, 43, 77, .08);

    }


    input::placeholder {

      color: #a4abb7;

    }


    button {

      width: 100%;

      height: 54px;

      border: none;

      border-radius: 12px;

      background: #172b4d;

      color: #ffffff;

      font-size: 16px;

      font-family: inherit;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform .15s,
        opacity .15s;

    }


    button:hover {

      transform:
        translateY(-1px);

    }


    button:disabled {

      opacity: .55;

      cursor: not-allowed;

      transform: none;

    }


    .message {

      display: none;

      margin-bottom: 20px;

      padding:
        13px 15px;

      border-radius: 10px;

      font-size: 13px;

      line-height: 1.8;

      text-align: center;

    }


    .message.show {

      display: block;

    }


    .message.error {

      background: #fff1f1;

      color: #b42318;

      border:
        1px solid #ffd0d0;

    }


    .message.success {

      background: #eefaf3;

      color: #16794c;

      border:
        1px solid #c8ead8;

    }


    .loading {

      display: none;

      text-align: center;

      margin:
        0 0 18px;

      color: #697386;

      font-size: 13px;

    }


    .loading.show {

      display: block;

    }


    .loading::before {

      content: '';

      display: inline-block;

      width: 15px;

      height: 15px;

      margin-left: 8px;

      vertical-align: -3px;

      border:
        2px solid #dfe3e9;

      border-top-color: #172b4d;

      border-radius: 50%;

      animation:
        spin .8s linear infinite;

    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    .back-link {

      display: block;

      text-align: center;

      margin-top: 20px;

      color: #172b4d;

      text-decoration: none;

      font-size: 13px;

      font-weight: 600;

    }


    .back-link:hover {

      color: #d4af37;

    }


    .footer {

      text-align: center;

      margin-top: 20px;

      color: #8a93a3;

      font-size: 11px;

      line-height: 1.8;

    }


    @media
    (max-width: 480px) {

      body {

        padding: 14px;

      }


      .card {

        padding:
          28px 20px 24px;

        border-radius: 16px;

      }


      h1 {

        font-size: 22px;

      }

    }

  </style>

</head>


<body>


  <main class="page">


    <section class="card">


      <div class="logo">
        آ
      </div>


      <h1>
        تغییر رمز عبور
      </h1>


      <div class="gold-line"></div>


      <p class="subtitle">
        رمز عبور جدید خود را وارد کنید
        تا دسترسی شما به سامانه
        دوباره فعال شود.
      </p>


      <!-- پیام خطا / موفقیت -->

      <div
        id="message"
        class="message"
        role="alert"
        aria-live="polite"
      ></div>


      <!-- وضعیت بارگذاری -->

      <div
        id="loading"
        class="loading"
      >
        در حال بررسی لینک بازیابی...
      </div>


      <!-- فرم تغییر رمز -->

      <form
        id="resetPasswordForm"
        autocomplete="off"
      >


        <div class="field">

          <label for="newPassword">
            رمز عبور جدید
          </label>

          <input
            id="newPassword"
            name="newPassword"
            type="password"
            placeholder="حداقل ۸ کاراکتر"
            minlength="8"
            autocomplete="new-password"
            required
          >

        </div>


        <div class="field">

          <label for="confirmPassword">
            تکرار رمز عبور جدید
          </label>

          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            placeholder="رمز عبور را دوباره وارد کنید"
            minlength="8"
            autocomplete="new-password"
            required
          >

        </div>


        <button
          id="savePasswordBtn"
          type="submit"
        >
          ثبت رمز عبور جدید
        </button>


      </form>


      <a
        class="back-link"
        href="login.html"
      >
        بازگشت به صفحه ورود
      </a>


    </section>


    <div class="footer">

      مرکز تخصصی سلامت طیور آدینه<br>

      متخصص بهداشت و بیماری‌های طیور

    </div>


  </main>


  <!-- Supabase -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
  ></script>


  <!-- Supabase Client -->

  <script src="supabase.js"></script>


  <!-- Password Recovery -->

  <script src="reset-password.js"></script>


</body>

</html>
