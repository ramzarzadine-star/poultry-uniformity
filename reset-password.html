<!DOCTYPE html>

<html
  lang="fa"
  dir="rtl"
>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0b766e"
  >

  <title>
    بازیابی رمز عبور | مرکز تخصصی سلامت طیور آدینه
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #0b1f1a,
          #12382f,
          #071511
        );

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      color: #17211e;

    }


    .card {

      width: 100%;

      max-width: 430px;

      background:
        rgba(255,255,255,.97);

      border-radius: 24px;

      padding:
        32px 26px;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.35);

    }


    .logo {

      width: 82px;

      height: 82px;

      margin:
        0 auto 18px;

      border-radius: 20px;

      object-fit: contain;

      display: block;

    }


    h1 {

      text-align: center;

      margin:
        0 0 8px;

      font-size: 24px;

    }


    .subtitle {

      text-align: center;

      color: #66736e;

      font-size: 14px;

      line-height: 1.8;

      margin-bottom: 28px;

    }


    label {

      display: block;

      margin-bottom: 8px;

      font-size: 14px;

      font-weight: 600;

    }


    input {

      width: 100%;

      height: 52px;

      border:
        1px solid #d6dedb;

      border-radius: 13px;

      padding:
        0 15px;

      font-size: 16px;

      outline: none;

      margin-bottom: 18px;

      background:
        #fafcfb;

      direction: ltr;

      text-align: left;

    }


    input:focus {

      border-color:
        #217a62;

      box-shadow:
        0 0 0 3px
        rgba(33,122,98,.12);

    }


    button {

      width: 100%;

      height: 54px;

      border: 0;

      border-radius: 14px;

      background:
        #176b54;

      color: #fff;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      transition: .2s;

    }


    button:hover {

      background:
        #125640;

    }


    button:disabled {

      opacity: .6;

      cursor:
        not-allowed;

    }


    .message {

      display: none;

      margin-top: 18px;

      padding:
        13px 14px;

      border-radius: 12px;

      font-size: 14px;

      line-height: 1.8;

      text-align: center;

    }


    .message.show {

      display: block;

    }


    .message.error {

      background:
        #fff0f0;

      color:
        #a32323;

    }


    .message.success {

      background:
        #eaf8f1;

      color:
        #176b54;

    }


    .loading {

      display: none;

      text-align: center;

      color:
        #66736e;

      font-size: 13px;

      margin-top: 15px;

    }


    .loading.show {

      display: block;

    }


    .footer {

      text-align: center;

      margin-top: 24px;

      color:
        #84908c;

      font-size: 12px;

    }

  </style>

</head>


<body>


  <main class="card">


    <img
      class="logo"
      src="IMG_4309.png"
      alt="مرکز تخصصی سلامت طیور آدینه"
    >


    <h1>
      بازیابی رمز عبور
    </h1>


    <div class="subtitle">

      رمز عبور جدید خود را وارد کنید.

      <br>

      پس از ذخیره، می‌توانید با رمز جدید وارد سامانه شوید.

    </div>


    <form
      id="resetPasswordForm"
    >


      <label
        for="newPassword"
      >
        رمز عبور جدید
      </label>


      <input
        id="newPassword"
        type="password"
        autocomplete="new-password"
        minlength="8"
        placeholder="حداقل ۸ کاراکتر"
        required
      >


      <label
        for="confirmPassword"
      >
        تکرار رمز عبور جدید
      </label>


      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        minlength="8"
        placeholder="رمز عبور را دوباره وارد کنید"
        required
      >


      <button
        id="savePasswordBtn"
        type="submit"
      >

        ذخیره رمز عبور جدید

      </button>


    </form>


    <div
      id="loading"
      class="loading"
    >

      در حال بررسی و ذخیره رمز عبور...

    </div>


    <div
      id="message"
      class="message"
    ></div>


    <div class="footer">

      مرکز تخصصی سلامت طیور آدینه

    </div>


  </main>


  <!-- =================================================
       SUPABASE LIBRARY
  ================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
  ></script>


  <!-- =================================================
       MAIN SUPABASE CLIENT
  ================================================== -->

  <script
    src="supabase.js"
  ></script>


  <!-- =================================================
       RESET PASSWORD
  ================================================== -->

  <script
    src="reset-password.js"
  ></script>


</body>

</html>
