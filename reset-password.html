<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#176b54"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <title>
    تغییر رمز عبور | مرکز تخصصی سلامت طیور آدینه
  </title>

  <style>

    :root {
      --green: #176b54;
      --green-dark: #0d4b3a;
      --text: #17352d;
      --muted: #718079;
      --border: #d8e2de;
      --danger: #a52525;
      --danger-bg: #fff1f1;
      --success: #176b54;
      --success-bg: #eaf8f1;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
    }

    body {

      margin: 0;

      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(54, 151, 119, .28),
          transparent 32%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(20, 101, 76, .35),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #031b15 0%,
          #0a382c 48%,
          #06251d 100%
        );

      color: var(--text);

      display: flex;

      align-items: center;

      justify-content: center;

      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    .page {

      width: 100%;

      max-width: 430px;
    }

    .card {

      background:
        rgba(255,255,255,.985);

      border-radius: 28px;

      padding: 30px 24px 24px;

      box-shadow:
        0 30px 80px rgba(0,0,0,.34),
        0 5px 20px rgba(0,0,0,.10);
    }

    .brand {

      text-align: center;

      margin-bottom: 25px;
    }

    .logo {

      width: 82px;

      height: 82px;

      object-fit: contain;

      display: block;

      margin:
        0 auto 14px;

      border-radius: 20px;
    }

    h1 {

      margin: 0;

      color: #173b32;

      font-size: 23px;

      line-height: 1.4;

      font-weight: 800;
    }

    .description {

      margin:
        8px 0 0;

      color: var(--muted);

      font-size: 13px;

      line-height: 1.9;
    }

    .field {

      margin-bottom: 16px;
    }

    label {

      display: block;

      margin-bottom: 7px;

      color: #354840;

      font-size: 13px;

      font-weight: 750;
    }

    .input-wrap {

      position: relative;
    }

    input {

      width: 100%;

      height: 53px;

      border:
        1px solid var(--border);

      border-radius: 13px;

      padding:
        0 50px 0 14px;

      background: #fafcfb;

      color: #19342d;

      font-family: inherit;

      font-size: 16px;

      direction: ltr;

      text-align: left;

      outline: none;

      transition:
        border-color .18s ease,
        box-shadow .18s ease;
    }

    input:focus {

      border-color:
        var(--green);

      background: white;

      box-shadow:
        0 0 0 3px
        rgba(23,107,84,.11);
    }

    .toggle {

      position: absolute;

      top: 50%;

      right: 9px;

      transform:
        translateY(-50%);

      width: 37px;

      height: 37px;

      border: 0;

      border-radius: 9px;

      background: transparent;

      color: #718079;

      font-family: inherit;

      font-size: 12px;

      font-weight: 700;

      cursor: pointer;
    }

    .toggle:active {

      background:
        #edf3f0;
    }

    .requirements {

      margin:
        -5px 0 17px;

      padding:
        10px 12px;

      background:
        #f4f8f6;

      border-radius: 11px;

      color: #6d7974;

      font-size: 11px;

      line-height: 1.9;
    }

    .primary {

      width: 100%;

      min-height: 53px;

      border: 0;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #19765c,
          #125d47
        );

      color: white;

      font-family: inherit;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 7px 18px
        rgba(23,107,84,.20);

      transition:
        opacity .18s ease,
        transform .12s ease;
    }

    .primary:active {

      transform:
        scale(.985);
    }

    button:disabled {

      opacity: .58;

      cursor:
        not-allowed;
    }

    .back {

      display: block;

      width: 100%;

      margin-top: 13px;

      min-height: 40px;

      border: 0;

      background: transparent;

      color: var(--green);

      font-family: inherit;

      font-size: 12px;

      font-weight: 750;

      cursor: pointer;
    }

    .message {

      display: none;

      margin-top: 16px;

      padding:
        12px 13px;

      border-radius: 12px;

      font-size: 13px;

      line-height: 1.85;

      text-align: center;

      word-break: break-word;
    }

    .message.show {

      display: block;
    }

    .message.error {

      color: var(--danger);

      background: var(--danger-bg);

      border:
        1px solid #f4d2d2;
    }

    .message.success {

      color: var(--success);

      background: var(--success-bg);

      border:
        1px solid #ccebdd;
    }

    .message.info {

      color: #315d72;

      background: #eef7fb;

      border:
        1px solid #d5eaf3;
    }

    .loading {

      display: none;

      align-items: center;

      justify-content: center;

      gap: 8px;

      margin-top: 13px;

      color: var(--muted);

      font-size: 12px;
    }

    .loading.show {

      display: flex;
    }

    .spinner {

      width: 15px;

      height: 15px;

      border:
        2px solid #d9e6e1;

      border-top-color:
        var(--green);

      border-radius: 50%;

      animation:
        spin .75s linear infinite;
    }

    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }

    .footer {

      text-align: center;

      margin-top: 20px;

      color: #8a9691;

      font-size: 11px;
    }

    @media (max-width: 480px) {

      body {
        padding: 12px;
      }

      .card {
        padding:
          25px 18px 20px;
        border-radius: 24px;
      }

    }

  </style>

</head>


<body>

  <main class="page">

    <section
      class="card"
      aria-label="تغییر رمز عبور"
    >

      <div class="brand">

        <img
          class="logo"
          src="IMG_4309.png"
          alt="مرکز تخصصی سلامت طیور آدینه"
        >

        <h1>
          تغییر رمز عبور
        </h1>

        <p class="description">
          رمز عبور جدید خود را وارد کنید.
        </p>

      </div>


      <form
        id="resetPasswordForm"
        novalidate
      >

        <div class="field">

          <label for="newPassword">
            رمز عبور جدید
          </label>

          <div class="input-wrap">

            <input
              id="newPassword"
              type="password"
              autocomplete="new-password"
              minlength="8"
              placeholder="حداقل ۸ کاراکتر"
              required
            >

            <button
              id="toggleNewPassword"
              class="toggle"
              type="button"
              aria-label="نمایش رمز عبور"
            >
              نمایش
            </button>

          </div>

        </div>


        <div class="requirements">

          رمز عبور باید حداقل ۸ کاراکتر باشد.
          برای امنیت بیشتر از ترکیب حروف، اعداد و نمادها استفاده کنید.

        </div>


        <div class="field">

          <label for="confirmPassword">
            تکرار رمز عبور جدید
          </label>

          <div class="input-wrap">

            <input
              id="confirmPassword"
              type="password"
              autocomplete="new-password"
              minlength="8"
              placeholder="رمز عبور را دوباره وارد کنید"
              required
            >

            <button
              id="toggleConfirmPassword"
              class="toggle"
              type="button"
              aria-label="نمایش رمز عبور"
            >
              نمایش
            </button>

          </div>

        </div>


        <button
          id="updatePasswordButton"
          class="primary"
          type="submit"
        >
          ذخیره رمز عبور جدید
        </button>


        <button
          id="backToLogin"
          class="back"
          type="button"
        >
          بازگشت به صفحه ورود
        </button>

      </form>


      <div
        id="loading"
        class="loading"
        aria-live="polite"
      >

        <span
          class="spinner"
          aria-hidden="true"
        ></span>

        <span id="loadingText">
          در حال بررسی...
        </span>

      </div>


      <div
        id="message"
        class="message"
        role="alert"
        aria-live="polite"
      ></div>


      <div class="footer">

        مرکز تخصصی سلامت طیور آدینه

      </div>

    </section>

  </main>


  <!-- Supabase فقط یک بار -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js?v=20260818"
  ></script>


  <!-- همان Client مرحله ۲ -->

  <script
    src="supabase.js?v=20260818-auth1"
  ></script>


  <!-- منطق تغییر رمز -->

  <script
    src="reset-password.js?v=20260818-auth1"
  ></script>

</body>

</html>
