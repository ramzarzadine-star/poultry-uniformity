<!-- reset-password.html -->
<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازیابی رمز عبور</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="Login.css">
</head>
<body>
    <div class="login-container">
        <h2>تنظیم رمز عبور جدید</h2>
        <div id="message" class="message" style="display:none;"></div>
        
        <form id="reset-password-form">
            <div class="form-group">
                <label for="new-password">رمز عبور جدید</label>
                <input type="password" id="new-password" placeholder="حداقل ۶ کاراکتر" disabled required>
            </div>
            <div class="form-group">
                <label for="confirm-password">تکرار رمز عبور</label>
                <input type="password" id="confirm-password" placeholder="تکرار رمز عبور" disabled required>
            </div>
            <button type="submit" disabled>تغییر رمز عبور</button>
        </form>
        
        <p style="text-align: center; margin-top: 20px;">
            <a href="login.html">بازگشت به صفحه ورود</a>
        </p>
    </div>
    
    <script type="module" src="reset-password.js"></script>
</body>
</html>
