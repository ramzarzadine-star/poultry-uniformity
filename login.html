<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#176b54"
  >

  <title>
    ورود | مرکز تخصصی سلامت طیور آدینه
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      min-height: 100%;
    }


    body {

      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #05271f 0%,
          #0c4738 50%,
          #041a15 100%
        );

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 18px;

      color: #17352d;

    }


    .page {

      width: 100%;

      max-width: 440px;

    }


    .card {

      width: 100%;

      background:
        rgba(255,255,255,.98);

      border-radius: 26px;

      padding:
        30px 24px 24px;

      box-shadow:
        0 25px 70px
        rgba(0,0,0,.35);

    }


    .brand {

      text-align: center;

      margin-bottom: 20px;

    }


    .logo {

      width: 82px;

      height: 82px;

      object-fit: contain;

      display: block;

      margin: 0 auto 14px;

      border-radius: 18px;

    }


    .brand h1 {

      margin: 0;

      font-size: 24px;

      font-weight: 800;

      color: #173b32;

    }


    .brand p {

      margin:
        8px 0 0;

      color: #728079;

      font-size: 13px;

      line-height: 1.8;

    }


    .tabs {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 6px;

      padding: 5px;

      background: #edf3f0;

      border-radius: 13px;

      margin-bottom: 22px;

    }


    .tabs button {

      height: 43px;

      border: 0;

      border-radius: 10px;

      background: transparent;

      color: #687871;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

    }


    .tabs button.active {

      background: #176b54;

      color: white;

    }


    .field {

      margin-bottom: 15px;

    }


    label {

      display: block;

      margin-bottom: 7px;

      font-size: 13px;

      font-weight: 700;

      color: #344840;

    }


    input {

      width: 100%;

      height: 52px;

      border:
        1px solid #d5dfdb;

      border-radius: 12px;

      padding:
        0 14px;

      background: #fafcfb;

      color: #19342d;

      font-size: 16px;

      direction: ltr;

      text-align: left;

      outline: none;

    }


    input:focus {

      border-color: #176b54;

      background: white;

      box-shadow:
        0 0 0 3px
        rgba(23,107,84,.12);

    }


    .primary {

      width: 100%;

      height: 53px;

      border: 0;

      border-radius: 13px;

      background: #176b54;

      color: white;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

      margin-top: 5px;

    }


    .primary:hover {

      background: #125942;

    }


    .secondary-actions {

      display: flex;

      justify-content:
        space-between;

      gap: 10px;

      margin-top: 14px;

    }


    .link {

      border: 0;

      background: transparent;

      color: #176b54;

      font-size: 12px;

      font-weight: 700;

      cursor: pointer;

      padding: 5px;

    }


    .link:hover {

      text-decoration: underline;

    }


    button:disabled {

      opacity: .55;

      cursor: not-allowed;

    }


    .message {

      display: none;

      margin-top: 16px;

      padding: 12px 13px;

      border-radius: 11px;

      font-size: 13px;

      line-height: 1.8;

      text-align: center;

    }


    .message.show {

      display: block;

    }


    .message.error {

      color: #9c2222;

      background: #fff0f0;

    }


    .message.success {

      color: #176b54;

      background: #eaf8f1;

    }


    .loading {

      display: none;

      text-align: center;

      margin-top: 13px;

      color: #728079;

      font-size: 12px;

    }


    .loading.show {

      display: block;

    }


    .footer {

      text-align: center;

      margin-top: 22px;

      color: #8b9792;

      font-size: 11px;

    }


    @media (max-width: 480px) {

      body {
        padding: 12px;
      }

      .card {
        padding:
          26px 19px 22px;
      }

    }

  </style>

</head>


<body>

  <main class="page">

    <section class="card">


      <div class="brand">

        <img
          class="logo"
          src="IMG_4309.png"
          alt="مرکز تخصصی سلامت طیور آدینه"
        >

        <h1 id="modeTitle">
          ورود به سامانه
        </h1>

        <p id="modeText">
          برای ورود، ایمیل و رمز عبور خود را وارد کنید.
        </p>

      </div>


      <!-- =========================
           TABS
      ========================== -->

      <div
        id="modeSwitch"
        class="tabs"
      >

        <button
          id="loginModeBtn"
          type="button"
          class="active"
        >
          ورود
        </button>


        <button
          id="registerModeBtn"
          type="button"
        >
          ثبت‌نام
        </button>

      </div>


      <!-- =========================
           LOGIN
      ========================== -->

      <form
        id="loginForm"
        autocomplete="on"
      >

        <div class="field">

          <label for="loginEmail">
            ایمیل
          </label>

          <input
            id="loginEmail"
            name="email"
            type="email"
            autocomplete="username"
            inputmode="email"
            placeholder="example@email.com"
            required
          >

        </div>


        <div class="field">

          <label for="loginPassword">
            رمز عبور
          </label>

          <input
            id="loginPassword"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="رمز عبور"
            required
          >

        </div>


        <button
          id="loginButton"
          class="primary"
          type="submit"
        >
          ورود به سامانه
        </button>


        <div class="secondary-actions">

          <button
            id="forgotBtn"
            class="link"
            type="button"
          >
            فراموشی رمز عبور
          </button>


          <button
            id="magicLinkBtn"
            class="link"
            type="button"
          >
            ورود با لینک ایمیل
          </button>

        </div>

      </form>


      <!-- =========================
           REGISTER
      ========================== -->

      <form
        id="registerForm"
        hidden
        autocomplete="on"
      >

        <div class="field">

          <label for="firstName">
            نام
          </label>

          <input
            id="firstName"
            name="given-name"
            type="text"
            autocomplete="given-name"
            required
          >

        </div>


        <div class="field">

          <label for="lastName">
            نام خانوادگی
          </label>

          <input
            id="lastName"
            name="family-name"
            type="text"
            autocomplete="family-name"
            required
          >

        </div>


        <div class="field">

          <label for="registerPhone">
            شماره تلفن
          </label>

          <input
            id="registerPhone"
            name="tel"
            type="tel"
            autocomplete="tel"
            inputmode="tel"
            placeholder="09xxxxxxxxx"
          >

        </div>


        <div class="field">

          <label for="registerEmail">
            ایمیل
          </label>

          <input
            id="registerEmail"
            name="email"
            type="email"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="registerPassword">
            رمز عبور
          </label>

          <input
            id="registerPassword"
            name="new-password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
          >

        </div>


        <div class="field">

          <label for="registerPasswordConfirm">
            تکرار رمز عبور
          </label>

          <input
            id="registerPasswordConfirm"
            name="new-password-confirm"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
          >

        </div>


        <button
          id="registerButton"
          class="primary"
          type="submit"
        >
          ایجاد حساب کاربری
        </button>

      </form>


      <div
        id="loading"
        class="loading"
      >
        در حال اتصال به سامانه...
      </div>


      <div
        id="message"
        class="message"
        role="alert"
        aria-live="polite"
      ></div>


      <div class="footer">
        مرکز تخصصی سلامت طیور آدینه
      </div>

    </section>

  </main>


  <!-- فقط یک بار Supabase -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
  ></script>


  <script src="supabase.js"></script>

  <script src="login.js"></script>

</body>

</html>
