<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود - مرکز تخصصی سلامت طیور آدینه</title>

    <link rel="stylesheet" href="Style.css">
</head>

<body>

<main class="login-page">

    <section class="login-box">

        <img
            src="IMG_4309.png"
            class="login-logo"
            alt="مرکز تخصصی سلامت طیور آدینه"
        >

        <h1>مرکز تخصصی سلامت طیور آدینه</h1>

        <h3>سامانه مدیریت و پایش گله</h3>

        <input
            id="username"
            type="text"
            autocomplete="username"
            placeholder="نام کاربری"
        >

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="رمز عبور"
        >

        <div class="login-buttons">

            <button
                class="btn btn-primary"
                type="button"
                onclick="register()"
            >
                ثبت نام
            </button>

            <button
                class="btn btn-primary"
                type="button"
                onclick="login()"
            >
                ورود
            </button>

            <button
                class="btn guest"
                type="button"
                onclick="guestLogin()"
            >
                ورود مهمان
            </button>

        </div>

        <p id="message"></p>

    </section>

</main>

<script src="login.js"></script>

</body>
</html>
