<!doctype html>

<html lang="fa" dir="rtl">

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<link
rel="stylesheet"
href="Style.css"
>

<title>
ورود | مرکز تخصصی سلامت طیور آدینه
</title>

</head>


<body class="login-page">


<div class="login-hero">


<div class="login-bg"></div>


<img
src="IMG_4309.png"
class="login-logo"
alt="لوگو"
>


<h1>
مرکز تخصصی سلامت طیور آدینه
</h1>


<p>
سامانه پایش و مدیریت سلامت گله‌های طیور
</p>


</div>


<main class="login-card">


<h2>
ورود به سامانه
</h2>


<input
id="username"
placeholder="نام کاربری"
>


<input
id="password"
type="password"
placeholder="رمز عبور"
>


<button onclick="login()">
ورود
</button>


<button
class="secondary"
onclick="register()"
>
ثبت نام
</button>


<button
class="ghost"
onclick="guestLogin()"
>
ورود مهمان
</button>


<p
id="message"
class="message"
></p>


</main>


<script src="login.js"></script>

</body>

</html>
