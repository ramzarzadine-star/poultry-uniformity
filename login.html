<!doctype html>

<html
  lang="fa"
  dir="rtl"
>

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b766e"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <title>
    ورود امن | مرکز تخصصی سلامت طیور آدینه
  </title>

  <link
    rel="stylesheet"
    href="Login.css"
  >

</head>


<body class="login-body">


<main class="login-page">


<section
  class="login-card"
  aria-label="احراز هویت"
>


  <div class="login-brand">

    <div class="logo-wrap">

      <img
        src="IMG_4309.png"
        alt="مرکز تخصصی سلامت طیور آدینه"
        onerror="this.style.display='none'"
      >

      <div class="logo-fallback">
        🐔
      </div>

    </div>


    <div>

      <div class="brand-title">

        مرکز تخصصی سلامت طیور آدینه

      </div>


      <div class="brand-subtitle">

        سامانه حرفه‌ای پایش و مدیریت طیور

      </div>

    </div>

  </div>


  <div
    class="mode-switch"
    role="tablist"
  >

    <button
      id="loginModeBtn"
      class="mode-btn active"
      type="button"
    >
      ورود
    </button>


    <button
      id="registerModeBtn"
      class="mode-btn"
      type="button"
    >
      ثبت‌نام
    </button>

  </div>


  <header class="login-heading">

    <h1 id="modeTitle">
      ورود امن به سامانه
    </h1>

    <p id="modeText">

      برای ورود از ایمیل و رمز عبور حساب خود استفاده کنید.

    </p>

  </header>


  <div
    id="message"
    class="login-message"
    role="alert"
    aria-live="polite"
  ></div>


  <div
    id="loading"
    class="loading-line"
    hidden
  >
    در حال برقراری ارتباط امن…
  </div>


  <!-- LOGIN -->

  <form
    id="loginForm"
    novalidate
  >

    <label
      for="loginEmail"
    >
      ایمیل
    </label>

    <input
      id="loginEmail"
      type="email"
      autocomplete="username"
      inputmode="email"
      placeholder="example@domain.com"
      required
    >


    <label
      for="loginPassword"
    >
      رمز عبور
    </label>

    <input
      id="loginPassword"
      type="password"
      autocomplete="current-password"
      placeholder="رمز عبور"
      required
    >


    <button
      id="submitLoginBtn"
      class="primary-btn"
      type="submit"
    >
      ورود به سامانه
    </button>


    <div class="secondary-actions">

      <button
        id="magicLinkBtn"
        type="button"
      >
        ورود با لینک ایمیل
      </button>


      <button
        id="forgotBtn"
        type="button"
      >
        فراموشی رمز عبور
      </button>

    </div>

  </form>


  <!-- REGISTER -->

  <form
    id="registerForm"
    hidden
    novalidate
  >

    <div class="form-grid">

      <div>

        <label
          for="firstName"
        >
          نام
        </label>

        <input
          id="firstName"
          type="text"
          autocomplete="given-name"
          placeholder="نام"
          required
        >

      </div>


      <div>

        <label
          for="lastName"
        >
          نام خانوادگی
        </label>

        <input
          id="lastName"
          type="text"
          autocomplete="family-name"
          placeholder="نام خانوادگی"
          required
        >

      </div>

    </div>


    <label
      for="registerPhone"
    >
      شماره تماس
    </label>

    <input
      id="registerPhone"
      type="tel"
      autocomplete="tel"
      inputmode="tel"
      placeholder="شماره تماس"
    >


    <label
      for="registerEmail"
    >
      ایمیل
    </label>

    <input
      id="registerEmail"
      type="email"
      autocomplete="email"
      inputmode="email"
      placeholder="example@domain.com"
      required
    >


    <label
      for="registerPassword"
    >
      رمز عبور
    </label>

    <input
      id="registerPassword"
      type="password"
      autocomplete="new-password"
      placeholder="حداقل ۸ کاراکتر"
      required
    >


    <label
      for="registerPasswordConfirm"
    >
      تکرار رمز عبور
    </label>

    <input
      id="registerPasswordConfirm"
      type="password"
      autocomplete="new-password"
      placeholder="تکرار رمز عبور"
      required
    >


    <button
      id="submitRegisterBtn"
      class="primary-btn"
      type="submit"
    >
      ایجاد حساب
    </button>

  </form>


  <div class="security-note">

    <span>🔒</span>

    <span>
      دسترسی فقط برای حساب‌های تأیید و فعال‌شده مجاز است.
    </span>

  </div>


  <footer>
    مرکز تخصصی سلامت طیور آدینه
  </footer>


</section>

</main>


<!-- =====================================================
     SUPABASE JAVASCRIPT LIBRARY
===================================================== -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
></script>


<!-- =====================================================
     SUPABASE CONFIGURATION
===================================================== -->

<script
  src="supabase-config.js"
></script>


<!-- =====================================================
     LOGIN / AUTHENTICATION
===================================================== -->

<script
  src="login.js"
></script>


</body>

</html>
