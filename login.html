<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#176b54"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <title>
    ورود | مرکز تخصصی سلامت طیور آدینه
  </title>

  <style>

    :root {
      --green: #176b54;
      --green-dark: #0d4b3a;
      --green-light: #eaf6f1;
      --text: #17352d;
      --muted: #718079;
      --border: #d8e2de;
      --danger: #a52525;
      --danger-bg: #fff1f1;
      --success: #176b54;
      --success-bg: #eaf8f1;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
    }

    body {

      margin: 0;

      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(54, 151, 119, .28),
          transparent 32%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(20, 101, 76, .35),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #031b15 0%,
          #0a382c 48%,
          #06251d 100%
        );

      color: var(--text);

      display: flex;

      align-items: center;

      justify-content: center;

      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));

      overflow-x: hidden;
    }

    .page {

      width: 100%;

      max-width: 430px;

      margin: auto;
    }

    .card {

      width: 100%;

      background:
        rgba(255, 255, 255, .985);

      border:
        1px solid rgba(255, 255, 255, .45);

      border-radius: 28px;

      padding:
        28px 24px 22px;

      box-shadow:
        0 30px 80px rgba(0, 0, 0, .34),
        0 5px 20px rgba(0, 0, 0, .10);

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);
    }

    .brand {

      text-align: center;

      margin-bottom: 22px;
    }

    .logo {

      width: 82px;

      height: 82px;

      object-fit: contain;

      display: block;

      margin:
        0 auto 14px;

      border-radius: 20px;
    }

    .brand h1 {

      margin: 0;

      color: #173b32;

      font-size: 24px;

      line-height: 1.35;

      font-weight: 800;

      letter-spacing: -.3px;
    }

    .brand p {

      margin:
        7px 0 0;

      color: var(--muted);

      font-size: 13px;

      line-height: 1.9;
    }

    /* ================================================
       TABS
       ================================================ */

    .tabs {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 5px;

      padding: 5px;

      background:
        #edf3f0;

      border-radius: 14px;

      margin-bottom: 22px;
    }

    .tab {

      height: 44px;

      border: 0;

      border-radius: 10px;

      background:
        transparent;

      color: #6d7974;

      font-family: inherit;

      font-size: 14px;

      font-weight: 750;

      cursor: pointer;

      transition:
        .18s ease;

      touch-action: manipulation;
    }

    .tab.active {

      background:
        var(--green);

      color: white;

      box-shadow:
        0 3px 10px
        rgba(23, 107, 84, .18);
    }

    /* ================================================
       FORMS
       ================================================ */

    form {

      width: 100%;
    }

    [hidden] {

      display: none !important;
    }

    .field {

      margin-bottom: 15px;
    }

    label {

      display: block;

      margin-bottom: 7px;

      color: #354840;

      font-size: 13px;

      font-weight: 750;
    }

    .input-wrap {

      position: relative;

      width: 100%;
    }

    input {

      width: 100%;

      height: 52px;

      border:
        1px solid var(--border);

      border-radius: 13px;

      padding:
        0 14px;

      background:
        #fafcfb;

      color:
        #19342d;

      font-family: inherit;

      font-size: 16px;

      line-height: 1;

      direction: ltr;

      text-align: left;

      outline: none;

      transition:
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
    }

    input::placeholder {

      color:
        #a2aca8;

      opacity: 1;
    }

    input:focus {

      border-color:
        var(--green);

      background:
        #ffffff;

      box-shadow:
        0 0 0 3px
        rgba(23, 107, 84, .11);
    }

    input:invalid:not(:placeholder-shown) {

      border-color:
        #d9a2a2;
    }

    /* ================================================
       PASSWORD TOGGLE
       ================================================ */

    .password-toggle {

      position: absolute;

      top: 50%;

      right: 10px;

      transform:
        translateY(-50%);

      width: 36px;

      height: 36px;

      padding: 0;

      border: 0;

      border-radius: 9px;

      background:
        transparent;

      color:
        #718079;

      cursor: pointer;

      font-family: inherit;

      font-size: 13px;

      font-weight: 700;
    }

    .password-toggle:active {

      background:
        #edf3f0;
    }

    .password-field {

      padding-right: 48px;
    }

    /* ================================================
       PRIMARY BUTTON
       ================================================ */

    .primary {

      position: relative;

      width: 100%;

      min-height: 53px;

      border: 0;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #19765c,
          #125d47
        );

      color: white;

      font-family: inherit;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

      margin-top: 5px;

      box-shadow:
        0 7px 18px
        rgba(23, 107, 84, .20);

      transition:
        transform .12s ease,
        opacity .18s ease,
        box-shadow .18s ease;

      touch-action: manipulation;
    }

    .primary:active {

      transform:
        scale(.985);
    }

    .primary:hover {

      box-shadow:
        0 9px 22px
        rgba(23, 107, 84, .28);
    }

    button:disabled {

      opacity: .58;

      cursor:
        not-allowed;

      transform:
        none !important;
    }

    /* ================================================
       SECONDARY ACTIONS
       ================================================ */

    .secondary-actions {

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 10px;

      margin-top: 13px;
    }

    .link {

      min-height: 34px;

      border: 0;

      background:
        transparent;

      color:
        var(--green);

      font-family: inherit;

      font-size: 12px;

      font-weight: 750;

      cursor: pointer;

      padding:
        5px 3px;

      touch-action: manipulation;
    }

    .link:active {

      opacity: .65;
    }

    /* ================================================
       MESSAGE
       ================================================ */

    .message {

      display: none;

      margin-top: 16px;

      padding:
        12px 13px;

      border-radius: 12px;

      font-size: 13px;

      line-height: 1.85;

      text-align: center;

      word-break: break-word;
    }

    .message.show {

      display: block;
    }

    .message.error {

      color:
        var(--danger);

      background:
        var(--danger-bg);

      border:
        1px solid #f4d2d2;
    }

    .message.success {

      color:
        var(--success);

      background:
        var(--success-bg);

      border:
        1px solid #ccebdd;
    }

    .message.info {

      color:
        #315d72;

      background:
        #eef7fb;

      border:
        1px solid #d5eaf3;
    }

    /* ================================================
       LOADING
       ================================================ */

    .loading {

      display: none;

      align-items: center;

      justify-content: center;

      gap: 8px;

      margin-top: 13px;

      color:
        #718079;

      font-size: 12px;
    }

    .loading.show {

      display: flex;
    }

    .spinner {

      width: 15px;

      height: 15px;

      border:
        2px solid #d9e6e1;

      border-top-color:
        var(--green);

      border-radius: 50%;

      animation:
        adineh-spin .75s linear infinite;
    }

    @keyframes adineh-spin {

      to {
        transform: rotate(360deg);
      }

    }

    /* ================================================
       FOOTER
       ================================================ */

    .footer {

      text-align: center;

      margin-top: 20px;

      color:
        #8a9691;

      font-size: 11px;

      line-height: 1.7;
    }

    /* ================================================
       MOBILE
       ================================================ */

    @media (max-width: 480px) {

      body {
        padding:
          12px;
      }

      .card {

        padding:
          25px 18px 20px;

        border-radius:
          24px;
      }

      .brand h1 {

        font-size:
          22px;
      }

    }

    @media (max-height: 680px) {

      .card {

        padding-top:
          20px;

        padding-bottom:
          17px;
      }

      .logo {

        width:
          65px;

        height:
          65px;

        margin-bottom:
          9px;
      }

      .brand {

        margin-bottom:
          15px;
      }

      .field {

        margin-bottom:
          11px;
      }

    }

  </style>

</head>


<body>

  <main class="page">

    <section
      class="card"
      aria-label="ورود به سامانه"
    >


      <!-- ============================================
           BRAND
           ============================================ -->

      <div class="brand">

        <img
          class="logo"
          src="IMG_4309.png"
          alt="مرکز تخصصی سلامت طیور آدینه"
        >

        <h1 id="modeTitle">
          ورود به سامانه
        </h1>

        <p id="modeText">
          برای ورود، ایمیل و رمز عبور خود را وارد کنید.
        </p>

      </div>


      <!-- ============================================
           MODE TABS
           ============================================ -->

      <div
        id="modeSwitch"
        class="tabs"
        role="tablist"
        aria-label="نوع دسترسی"
      >

        <button
          id="loginModeBtn"
          class="tab active"
          type="button"
          role="tab"
          aria-selected="true"
        >
          ورود
        </button>


        <button
          id="registerModeBtn"
          class="tab"
          type="button"
          role="tab"
          aria-selected="false"
        >
          ثبت‌نام
        </button>

      </div>


      <!-- ============================================
           LOGIN FORM
           ============================================ -->

      <form
        id="loginForm"
        autocomplete="on"
        novalidate
      >

        <div class="field">

          <label
            for="loginEmail"
          >
            ایمیل
          </label>

          <input
            id="loginEmail"
            name="email"
            type="email"
            autocomplete="username"
            inputmode="email"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            placeholder="example@email.com"
            required
          >

        </div>


        <div class="field">

          <label
            for="loginPassword"
          >
            رمز عبور
          </label>

          <div class="input-wrap">

            <input
              id="loginPassword"
              class="password-field"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="رمز عبور"
              required
            >

            <button
              id="loginPasswordToggle"
              class="password-toggle"
              type="button"
              aria-label="نمایش رمز عبور"
              aria-pressed="false"
            >
              نمایش
            </button>

          </div>

        </div>


        <button
          id="loginButton"
          class="primary"
          type="submit"
        >
          ورود به سامانه
        </button>


        <div
          class="secondary-actions"
        >

          <button
            id="forgotBtn"
            class="link"
            type="button"
          >
            فراموشی رمز عبور
          </button>


          <button
            id="magicLinkBtn"
            class="link"
            type="button"
          >
            ورود با لینک ایمیل
          </button>

        </div>

      </form>


      <!-- ============================================
           REGISTER FORM
           ============================================ -->

      <form
        id="registerForm"
        hidden
        autocomplete="on"
        novalidate
      >

        <div class="field">

          <label
            for="firstName"
          >
            نام
          </label>

          <input
            id="firstName"
            name="given-name"
            type="text"
            autocomplete="given-name"
            required
          >

        </div>


        <div class="field">

          <label
            for="lastName"
          >
            نام خانوادگی
          </label>

          <input
            id="lastName"
            name="family-name"
            type="text"
            autocomplete="family-name"
            required
          >

        </div>


        <div class="field">

          <label
            for="registerPhone"
          >
            شماره تلفن
          </label>

          <input
            id="registerPhone"
            name="tel"
            type="tel"
            autocomplete="tel"
            inputmode="tel"
            placeholder="09xxxxxxxxx"
          >

        </div>


        <div class="field">

          <label
            for="registerEmail"
          >
            ایمیل
          </label>

          <input
            id="registerEmail"
            name="email"
            type="email"
            autocomplete="email"
            inputmode="email"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            placeholder="example@email.com"
            required
          >

        </div>


        <div class="field">

          <label
            for="registerPassword"
          >
            رمز عبور
          </label>

          <div class="input-wrap">

            <input
              id="registerPassword"
              class="password-field"
              name="new-password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              placeholder="حداقل ۸ کاراکتر"
              required
            >

            <button
              id="registerPasswordToggle"
              class="password-toggle"
              type="button"
              aria-label="نمایش رمز عبور"
              aria-pressed="false"
            >
              نمایش
            </button>

          </div>

        </div>


        <div class="field">

          <label
            for="registerPasswordConfirm"
          >
            تکرار رمز عبور
          </label>

          <input
            id="registerPasswordConfirm"
            name="new-password-confirm"
            type="password"
            autocomplete="new-password"
            minlength="8"
            placeholder="رمز عبور را دوباره وارد کنید"
            required
          >

        </div>


        <button
          id="registerButton"
          class="primary"
          type="submit"
        >
          ایجاد حساب کاربری
        </button>

      </form>


      <!-- ============================================
           LOADING
           ============================================ -->

      <div
        id="loading"
        class="loading"
        aria-live="polite"
      >

        <span
          class="spinner"
          aria-hidden="true"
        ></span>

        <span id="loadingText">
          در حال اتصال به سامانه...
        </span>

      </div>


      <!-- ============================================
           MESSAGE
           ============================================ -->

      <div
        id="message"
        class="message"
        role="alert"
        aria-live="polite"
      ></div>


      <div class="footer">

        مرکز تخصصی سلامت طیور آدینه

      </div>


    </section>

  </main>


  <!-- ==================================================
       SUPABASE
       فقط یک بار
       ================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js?v=20260818"
  ></script>


  <!-- ==================================================
       PROJECT SUPABASE CLIENT
       ================================================== -->

  <script
    src="supabase.js?v=20260818-auth1"
  ></script>


  <!-- ==================================================
       LOGIN CONTROLLER
       ================================================== -->

  <script
    src="login.js?v=20260818-auth1"
  ></script>


  <script>

    /*
     * Password visibility
     * این بخش مستقل است و به Supabase
     * وابسته نیست.
     */

    (function () {

      function setupToggle(
        buttonId,
        inputId
      ) {

        const button =
          document.getElementById(
            buttonId
          );

        const input =
          document.getElementById(
            inputId
          );

        if (
          !button ||
          !input
        ) {
          return;
        }


        button.addEventListener(
          'click',
          function () {

            const visible =
              input.type === 'text';


            input.type =
              visible
                ? 'password'
                : 'text';


            button.textContent =
              visible
                ? 'نمایش'
                : 'پنهان';


            button.setAttribute(
              'aria-pressed',
              String(!visible)
            );


            button.setAttribute(
              'aria-label',
              visible
                ? 'نمایش رمز عبور'
                : 'پنهان کردن رمز عبور'
            );

          }
        );

      }


      setupToggle(
        'loginPasswordToggle',
        'loginPassword'
      );


      setupToggle(
        'registerPasswordToggle',
        'registerPassword'
      );

    })();

  </script>

</body>

</html>
