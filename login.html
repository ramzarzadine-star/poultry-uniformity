<!doctype html>

<html
  lang="fa"
  dir="rtl"
>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#07564f"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <title>
    ورود | مرکز تخصصی سلامت طیور آدینه
  </title>

  <link
    rel="stylesheet"
    href="Style.css"
  >

</head>


<body class="login-body">


  <main class="login-page">


    <section class="login-card">


      <!-- لوگو -->

      <div class="login-logo-wrap">

        <img
          src="IMG_4309.png"
          class="login-logo"
          alt="مرکز تخصصی سلامت طیور آدینه"
        >

      </div>


      <!-- عنوان -->

      <div class="login-heading">

        <h1>
          مرکز تخصصی سلامت طیور آدینه
        </h1>

        <p>
          سامانه تخصصی مدیریت و پایش سلامت فارم‌های طیور
        </p>

      </div>


      <!-- تب‌ها -->

      <div class="login-tabs">

        <button
          type="button"
          class="login-tab active"
          id="loginTab"
          onclick="showLoginMode()"
        >
          ورود
        </button>


        <button
          type="button"
          class="login-tab"
          id="registerTab"
          onclick="showRegisterMode()"
        >
          ثبت‌نام
        </button>

      </div>


      <!-- =========================
           ورود
      ========================== -->

      <div
        id="loginMode"
        class="login-mode"
      >

        <div class="login-form">


          <div class="login-field">

            <label for="loginEmail">
              ایمیل
            </label>

            <div class="input-wrap">

              <span class="input-icon">
                ✉
              </span>

              <input
                id="loginEmail"
                type="email"
                inputmode="email"
                autocomplete="email"
                placeholder="example@email.com"
              >

            </div>

          </div>


          <div class="login-field">

            <label for="loginPassword">
              رمز عبور
            </label>

            <div class="input-wrap">

              <span class="input-icon">
                ●
              </span>

              <input
                id="loginPassword"
                type="password"
                autocomplete="current-password"
                placeholder="رمز عبور"
              >

              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('loginPassword',this)"
                aria-label="نمایش رمز"
              >
                ◉
              </button>

            </div>

          </div>


          <button
            type="button"
            class="login-submit"
            id="loginButton"
            onclick="loginUser()"
          >

            <span>
              ورود به سامانه
            </span>

          </button>


          <button
            type="button"
            class="magic-button"
            onclick="sendMagicLink()"
          >
            ورود با لینک یک‌بارمصرف ایمیل
          </button>


          <button
            type="button"
            class="forgot-button"
            onclick="showForgotPassword()"
          >
            رمز عبور را فراموش کرده‌ام
          </button>


        </div>

      </div>


      <!-- =========================
           ثبت نام
      ========================== -->

      <div
        id="registerMode"
        class="login-mode"
        style="display:none;"
      >

        <div class="login-form">


          <div class="login-field">

            <label for="registerEmail">
              ایمیل
            </label>

            <div class="input-wrap">

              <span class="input-icon">
                ✉
              </span>

              <input
                id="registerEmail"
                type="email"
                inputmode="email"
                autocomplete="email"
                placeholder="ایمیل معتبر"
              >

            </div>

          </div>


          <div class="login-field">

            <label for="registerPassword">
              رمز عبور
            </label>

            <div class="input-wrap">

              <span class="input-icon">
                ●
              </span>

              <input
                id="registerPassword"
                type="password"
                autocomplete="new-password"
                placeholder="حداقل ۶ کاراکتر"
              >

              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('registerPassword',this)"
              >
                ◉
              </button>

            </div>

          </div>


          <div class="login-field">

            <label for="registerPassword2">
              تکرار رمز عبور
            </label>

            <div class="input-wrap">

              <span class="input-icon">
                ●
              </span>

              <input
                id="registerPassword2"
                type="password"
                autocomplete="new-password"
                placeholder="رمز عبور را دوباره وارد کنید"
              >

            </div>

          </div>


          <button
            type="button"
            class="login-submit"
            id="registerButton"
            onclick="registerUser()"
          >
            ایجاد حساب کاربری
          </button>


          <div class="register-note">

            پس از ثبت‌نام، فعال‌سازی حساب توسط مدیریت مرکز انجام می‌شود.

          </div>


        </div>

      </div>


      <!-- =========================
           فراموشی رمز
      ========================== -->

      <div
        id="forgotMode"
        class="login-mode"
        style="display:none;"
      >

        <div class="login-form">


          <div class="forgot-title">
            بازیابی رمز عبور
          </div>


          <p class="forgot-description">
            ایمیل حساب کاربری خود را وارد کنید تا لینک بازیابی برای شما ارسال شود.
          </p>


          <div class="login-field">

            <label for="forgotEmail">
              ایمیل
            </label>

            <div class="input-wrap">

              <span class="input-icon">
                ✉
              </span>

              <input
                id="forgotEmail"
                type="email"
                inputmode="email"
                autocomplete="email"
                placeholder="ایمیل حساب کاربری"
              >

            </div>

          </div>


          <button
            type="button"
            class="login-submit"
            onclick="resetPassword()"
          >
            ارسال لینک بازیابی
          </button>


          <button
            type="button"
            class="back-login-button"
            onclick="showLoginMode()"
          >
            بازگشت به ورود
          </button>


        </div>

      </div>


      <!-- پیام -->

      <div
        id="loginMessage"
        class="login-message"
      ></div>


      <!-- وضعیت -->

      <div class="login-footer">

        <span>
          سامانه اختصاصی
        </span>

        <span>
          •
        </span>

        <span>
          مرکز تخصصی سلامت طیور آدینه
        </span>

      </div>


    </section>


  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script
    src="login.js"
  ></script>


</body>

</html>
