<div class="card">


<h2>📊 گزارشات</h2>

</div>



<script src="database.js"></script>



<script>


let modules=[

"flock",

"feed",

"water",

"vaccine",

"medicine"

];



let text="";



modules.forEach(function(m){


let d=loadModule(m);



if(d){


text+=

"<h3>"+m+"</h3>"+

"<pre>"+JSON.stringify(d,null,2)+"</pre>";


}


});



document.getElementById("report").innerHTML=text;


</script>
