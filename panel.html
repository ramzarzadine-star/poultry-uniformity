<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
مدیریت گله طیور - مرکز تخصصی سلامت طیور آدینه
</title>

<link rel="stylesheet" href="Style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>


<style>

/* =========================================
   هدر اصلی
========================================= */

.header {

    position: relative;

    text-align: center;

    padding: 30px 20px 38px;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #007a4b,
            #008f68
        );

    border-radius: 0 0 45px 45px;

}


/* =========================================
   تصویر محو IMG_4317
========================================= */

.header::before {

    content: "";

    position: absolute;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(0, 110, 70, 0.70),
            rgba(0, 145, 105, 0.70)
        ),

        url("IMG_4317.jpeg");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    opacity: 0.32;

    z-index: 0;

    transform: scale(1.04);

}


/* =========================================
   محتوای هدر بالای تصویر
========================================= */

.header > * {

    position: relative;

    z-index: 2;

}


/* =========================================
   لوگوی مرکز
========================================= */

.header-logo {

    position: absolute;

    top: 14px;

    right: 16px;

    width: 52px;

    height: 52px;

    object-fit: contain;

    border-radius: 50%;

    background: transparent;

    mix-blend-mode: multiply;

    opacity: 0.95;

    z-index: 5;

}


/* =========================================
   عنوان اصلی
========================================= */

.header h1 {

    margin-top: 24px;

    margin-bottom: 8px;

    font-size: 30px;

    font-weight: 800;

}


/* =========================================
   نام مرکز
========================================= */

.header h3 {

    margin-top: 5px;

    font-size: 18px;

    font-weight: 500;

}


/* =========================================
   کاربر
========================================= */

#userBox {

    margin-top: 14px;

}


/* =========================================
   دکمه خروج
========================================= */

.logout {

    margin-top: 15px;

}


/* =========================================
   منوی برنامه
========================================= */

.menu {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 10px;

    padding: 15px;

}


/* =========================================
   کارت‌ها
========================================= */

.card {

    margin-bottom: 20px;

}


/* =========================================
   موبایل
========================================= */

@media (max-width: 600px) {

    .header {

        padding: 25px 15px 32px;

        border-radius: 0 0 40px 40px;

    }


    .header-logo {

        width: 45px;

        height: 45px;

        top: 12px;

        right: 12px;

    }


    .header h1 {

        font-size: 25px;

        margin-top: 22px;

    }


    .header h3 {

        font-size: 16px;

    }

}


/* =========================================
   آیفون کوچک
========================================= */

@media (max-width: 430px) {

    .header-logo {

        width: 42px;

        height: 42px;

        top: 11px;

        right: 11px;

    }


    .header h1 {

        font-size: 24px;

    }


    .header h3 {

        font-size: 15px;

    }

}

</style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="header">


    <!-- لوگوی مرکز -->

    <img
        src="IMG_4309.png"
        class="header-logo"
        alt="مرکز تخصصی سلامت طیور آدینه"
    >


    <h1>
        🐔 مدیریت گله طیور
    </h1>


    <h3>
        مرکز تخصصی سلامت طیور آدینه
    </h3>


    <div id="userBox"></div>


    <button
        onclick="logout()"
        class="logout"
    >
        خروج از حساب
    </button>


</header>



<!-- =========================================
     MENU
========================================= -->

<nav class="menu">


    <a href="panel.html">
        🏠 داشبورد
    </a>


    <a href="flock.html">
        🐔 مدیریت گله
    </a>


    <a href="feed.html">
        🌽 مصرف دان
    </a>


    <a href="water.html">
        💧 مصرف آب
    </a>


    <a href="vaccine.html">
        💉 واکسیناسیون
    </a>


    <a href="medicine.html">
        💊 دارو
    </a>


    <a href="report.html">
        📊 گزارشات
    </a>


</nav>



<!-- =========================================
     محتوای اصلی
========================================= -->

<div class="container">



    <!-- اطلاعات گله -->

    <div class="card">

        <h2>
            اطلاعات گله
        </h2>


        <div class="form-grid">


            <input
                id="farm"
                placeholder="نام فارم / مرغدار"
            >


            <input
                id="hall"
                placeholder="نام سالن"
            >


            <select id="type">

                <option>
                    نوع گله
                </option>

                <option>
                    گوشتی
                </option>

                <option>
                    تخمگذار
                </option>

                <option>
                    مادر
                </option>

            </select>


            <input
                id="age"
                placeholder="سن گله (روز)"
            >


            <input
                id="countBird"
                placeholder="تعداد پرنده"
            >


            <input
                id="date"
                type="date"
            >


        </div>

    </div>



    <!-- ورود وزن -->

    <div class="card">


        <h2>
            ورود وزن
        </h2>


        <textarea
            id="weightsInput"
            placeholder="وزن ها را وارد کنید"
        ></textarea>


        <button onclick="calculate()">
            محاسبه
        </button>


    </div>



    <!-- نتایج -->

    <div class="card">


        <h2>
            نتایج
        </h2>


        <div class="results">


            <div>

                تعداد نمونه

                <strong id="sample">
                    -
                </strong>

            </div>


            <div>

                میانگین وزن

                <strong id="mean">
                    -
                </strong>

            </div>


            <div>

                کمترین وزن

                <strong id="min">
                    -
                </strong>

            </div>


            <div>

                بیشترین وزن

                <strong id="max">
                    -
                </strong>

            </div>


            <div>

                SD

                <strong id="sd">
                    -
                </strong>

            </div>


            <div>

                CV

                <strong id="cv">
                    -
                </strong>

            </div>


            <div>

                یکنواختی ۱۰٪

                <strong id="u10">
                    -
                </strong>

            </div>


            <div>

                یکنواختی ۱۵٪

                <strong id="u15">
                    -
                </strong>

            </div>


        </div>


    </div>



    <!-- نمودار وزن -->

    <div class="card">


        <h2>
            نمودار وزن
        </h2>


        <canvas id="weightChart"></canvas>


    </div>



    <!-- نمودار رشد -->

    <div class="card">


        <h2>
            رشد وزن Ross 308
        </h2>


        <canvas id="weightTrendChart"></canvas>


    </div>



    <!-- نمودار CV -->

    <div class="card">


        <h2>
            CV Ross 308
        </h2>


        <canvas id="cvChart"></canvas>


    </div>


</div>



<!-- =========================================
     JavaScript
========================================= -->

<script src="Script.js"></script>


</body>

</html>
