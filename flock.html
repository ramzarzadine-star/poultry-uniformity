<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
مدیریت گله
</title>

<link rel="stylesheet" href="Style.css">

</head>


<body>


<header class="header">

<h1>🐔 مدیریت گله</h1>

<div id="userBox"></div>

</header>




<div class="container">


<div class="card">


<h2>
ثبت اطلاعات گله
</h2>


<input id="farm" placeholder="نام فارم">


<input id="hall" placeholder="نام سالن">


<select id="type">

<option>نوع گله</option>

<option>گوشتی</option>

<option>تخمگذار</option>

<option>مادر</option>

</select>



<input id="age" placeholder="سن گله (روز)">


<input id="count" placeholder="تعداد اولیه">


<input id="startDate" type="date">



<button onclick="saveFlock()">

ذخیره گله

</button>


</div>





<div class="card">


<h2>
لیست گله ها
</h2>


<div id="list"></div>


</div>



</div>





<script src="database.js"></script>


<script>


function saveFlock(){



let data={


farm:document.getElementById("farm").value,


hall:document.getElementById("hall").value,


type:document.getElementById("type").value,


age:document.getElementById("age").value,


count:document.getElementById("count").value,


date:document.getElementById("startDate").value


};




saveRecord(

"flock",

data

);



showFlock();


}




function showFlock(){



let data=loadRecords("flock");


let html="";



data.forEach(function(x,i){


html+=`

<div class="card">

<strong>
${x.farm}
</strong>

<br>

سالن: ${x.hall}

<br>

نوع: ${x.type}

<br>

سن: ${x.age}

روز

<br>

تعداد: ${x.count}

<br>

<button onclick="removeFlock(${i})">

حذف

</button>


</div>

`;



});



document.getElementById("list").innerHTML=html;


}





function removeFlock(i){


deleteRecord(

"flock",

i

);


showFlock();


}




window.onload=function(){

showFlock();

};


</script>



</body>

</html>
