>

rel="stylesheet"
href="Style.css"
>

<title>
مدیریت گله‌ها
</title>

</head>


<body>


<header class="header">

<img
src="IMG_4309.png"
class="header-logo"
alt="لوگو"
>

<h1>
مرکز تخصصی سلامت طیور آدینه
</h1>

<h3>
مدیریت گله‌ها
</h3>

<div class="user-row">

<span id="userBox"></span>

<button
class="logout"
data-logout
>
خروج
</button>

</div>

</header>


<nav class="menu">

</nav>


<main class="container">


<div class="card">

<h2>
ثبت گله جدید
</h2>


<div class="form-grid">


<input
id="farm"
placeholder="نام فارم / مرغدار"
>


<input
id="hall"
placeholder="نام سالن"
>


<select id="type">

<option value="">
نوع گله
</option>

<option>
گوشتی
</option>

<option>
تخمگذار
</option>

<option>
مادر
</option>

<option>
پولت
</option>

</select>


<input
id="breed"
placeholder="سویه / نژاد"
>


<input
id="initialCount"
type="number"
placeholder="تعداد اولیه پرنده"
>


<input
id="startDate"
type="date"
>


</div>


<div class="actions">

<button onclick="saveFlock()">
ثبت گله
</button>

</div>

</div>


<div class="card">

<h2>
گله‌های ثبت‌شده
</h2>

<div id="list"></div>

</div>


</main>


<script src="database.js"></script>

<script src="app.js"></script>


<script>

function saveFlock(){

if(!requireUser()){

return;

}


const farm=
document.getElementById("farm")
.value.trim();


const hall=
document.getElementById("hall")
.value.trim();


if(!farm || !hall){

alert(
"نام فارم و سالن الزامی است."
);

return;

}


const record=addRecord(

"flocks",

{

farm:farm,

hall:hall,

type:
document.getElementById("type").value,

breed:
document.getElementById("breed").value.trim(),

initialCount:
num(
document.getElementById("initialCount").value
),

startDate:
document.getElementById("startDate").value ||
todayISO(),

status:"فعال"

}

);


if(record){

setSelectedFlock(record.id);

render();

}

}


function render(){

const data=getFlocks();

const list=document.getElementById("list");


if(!data.length){

list.innerHTML=
"هنوز گله‌ای ثبت نشده است.";

return;

}


list.innerHTML=data.map(

function(flock){

return `

<div class="list-item">

<b>
${escapeHTML(flock.farm)}
—
${escapeHTML(flock.hall)}
</b>

<div class="meta">

${escapeHTML(flock.type)}

|

${escapeHTML(flock.breed || "")}

|

${fmt(flock.initialCount,0)}
قطعه

|

شروع:
${escapeHTML(flock.startDate)}

</div>


<div class="actions">

<button
onclick="selectFlock('${flock.id}')"
>
فعال کردن
</button>

<button
class="secondary"
onclick="removeFlock('${flock.id}')"
>
حذف
</button>

</div>

</div>

`;

}

).join("");

}


function selectFlock(id){

setSelectedFlock(id);

render();

}


function removeFlock(id){

if(!confirm("این گله حذف شود؟")){

return;

}


deleteRecord(
"flocks",
id
);


if(getSelectedFlock()===id){

setSelectedFlock("");

}


render();

}


document.addEventListener(

"DOMContentLoaded",

function(){

const start=
document.getElementById("startDate");

if(start){

start.value=todayISO();

}

render();

}

);

</script>

</body>

</html>
