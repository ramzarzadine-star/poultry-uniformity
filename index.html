<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>
مرکز تخصصی سلامت طیور آدینه
</title>


<link rel="stylesheet" href="Style.css">


<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>


</head>


<body>


<div class="container">


<h1>
🐔 مدیریت گله طیور
<span>
مرکز تخصصی سلامت طیور آدینه
</span>
</h1>



<div class="card">

<h2>
اطلاعات گله
</h2>


<div class="form">


<input id="farm" placeholder="نام فارم / مرغدار">


<input id="hall" placeholder="نام سالن">


<select id="type">

<option>
نوع گله
</option>

<option>
گوشتی
</option>

<option>
تخمگذار
</option>

<option>
مادر
</option>

</select>


<input id="age" placeholder="سن گله (روز)">


<input id="date" type="date">


<input id="number" placeholder="تعداد گله">


</div>


</div>





<div class="card">


<h2>
وزن گیری گله
</h2>


<textarea id="weightsInput"
placeholder="وزن ها را وارد کنید

مثال:
1850,1900,1950
"></textarea>



<button onclick="calculate()">
محاسبه و ثبت گزارش
</button>


</div>





<div class="card">


<h2>
خلاصه وضعیت گله
</h2>


<div class="grid">


<div>
تعداد نمونه
<strong id="count">-</strong>
</div>


<div>
میانگین وزن
<strong id="mean">-</strong>
</div>


<div>
کمترین وزن
<strong id="min">-</strong>
</div>


<div>
بیشترین وزن
<strong id="max">-</strong>
</div>


<div>
SD
<strong id="sd">-</strong>
</div>


<div>
CV
<strong id="cv">-</strong>
</div>


<div>
یکنواختی ۱۰٪
<strong id="u10">-</strong>
</div>

<div class="card">

<h2>
نمودار CV گله
</h2>

<canvas id="cvChart"></canvas>

</div>
<div>
یکنواختی ۱۵٪
<strong id="u15">-</strong>
</div>


</div>

</div>





<div class="card">


<h2>
نمودار یکنواختی گله ±10%
</h2>


<canvas id="weightChart"></canvas>


</div>







</div>


<script src="Script.js"></script>


</body>

</html>
