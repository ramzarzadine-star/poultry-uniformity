<!doctype html>

<html
  lang="fa"
  dir="rtl"
  class="auth-loading"
>

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b766e"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="سلامت طیور آدینه"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="stylesheet"
    href="Style.css"
  >

  <title>
    مرکز تخصصی سلامت طیور آدینه
  </title>


  <style>

    html.auth-loading body {
      margin: 0;
      background: #f4f7f8;
    }

    html.auth-loading #app {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .auth-loader {
      font-family:
        Vazirmatn,
        Arial,
        sans-serif;

      text-align: center;

      color: #0b766e;

      padding: 24px;
    }

    .auth-spinner {

      width: 38px;
      height: 38px;

      border: 4px solid #d9eeeb;

      border-top-color:
        #0b766e;

      border-radius: 50%;

      animation:
        spin .8s linear infinite;

      margin:
        0 auto 14px;
    }

    @keyframes spin {

      to {
        transform:
          rotate(360deg);
      }

    }

  </style>

</head>


<body class="auth-loading">

  <div id="app">

    <div class="auth-loader">

      <div
        class="auth-spinner"
      ></div>

      <strong>
        در حال بررسی دسترسی…
      </strong>

    </div>

  </div>


  <!-- Supabase -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- Configuration -->

  <script
    src="supabase-config.js"
  ></script>


  <!-- Authentication Guard -->

  <script
    src="auth-guard.js"
  ></script>


  <!-- Main Application -->

  <script
    src="app.js"
  ></script>

</body>

</html>
