<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
مدیریت گله طیور - مرکز تخصصی سلامت طیور آدینه
</title>


<link rel="stylesheet" href="style.css">


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


</head>


<body>


<div class="container">


<h1>
🐔 مدیریت گله طیور

<span>
(مرکز تخصصی سلامت طیور آدینه)
</span>

</h1>



<div class="card">


<h2>
ورود وزن‌ها
</h2>


<textarea id="weightsInput"
placeholder="
مثال:
1850,1900,1750,2000

یا

۱۸۵۰،۱۹۰۰،۱۷۵۰
"></textarea>


<button onclick="calculate()">
محاسبه
</button>


</div>





<div class="results card">


<h2>
نتایج یکنواختی گله
</h2>


<div class="grid">


<div>
تعداد نمونه
<strong id="count">
-
</strong>
</div>



<div>
میانگین وزن
<strong id="mean">
-
</strong>
</div>



<div>
کمترین وزن
<strong id="min">
-
</strong>
</div>



<div>
بیشترین وزن
<strong id="max">
-
</strong>
</div>



<div>
انحراف معیار SD
<strong id="sd">
-
</strong>
</div>



<div>
ضریب تغییرات CV
<strong id="cv">
-
</strong>
</div>



<div>
یکنواختی ±10%
<strong id="u10">
-
</strong>
</div>



<div>
یکنواختی ±15%
<strong id="u15">
-
</strong>
</div>



</div>

</div>





<div class="card">

<h2>
نمودار توزیع وزن
</h2>


<canvas id="weightChart"></canvas>


</div>




<div class="card">


<h2>
نمودار CV
</h2>


<canvas id="cvChart"></canvas>


</div>



</div>




<script src="script.js"></script>


</body>

</html>
