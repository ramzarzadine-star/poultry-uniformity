<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
فرم مدیریت گله طیور - مرکز تخصصی سلامت طیور آدینه
</title>

<link rel="stylesheet" href="Style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

</head>


<body>


<header class="header">

<h1>
🐔 فرم مدیریت گله طیور
</h1>

<h3>
مرکز تخصصی سلامت طیور آدینه
</h3>

</header>



<div class="container">



<div class="card">

<h2>اطلاعات گله</h2>


<div class="form-grid">


<input id="farm" placeholder="نام فارم / مرغدار">


<input id="hall" placeholder="نام سالن">


<select id="type">

<option>نوع گله</option>
<option>گوشتی</option>
<option>تخمگذار</option>
<option>مادر</option>

</select>


<input id="age" placeholder="سن گله (روز)">


<input id="countBird" placeholder="تعداد گله">


<input id="date" type="date">


</div>

</div>





<div class="card">


<h2>
ورود وزن جوجه
</h2>


<textarea id="weightsInput"
placeholder="وزن ها را وارد کنید
مثال:
1850,1900,1950,2000
یا
۱۸۵۰،۱۹۰۰،۱۹۵۰"></textarea>


<button onclick="calculate()">
محاسبه
</button>


</div>






<div class="card">


<h2>
نتایج
</h2>


<div class="results">


<div>
تعداد نمونه
<strong id="sample">-</strong>
</div>


<div>
میانگین وزن
<strong id="mean">-</strong>
</div>


<div>
کمترین وزن
<strong id="min">-</strong>
</div>


<div>
بیشترین وزن
<strong id="max">-</strong>
</div>


<div>
SD
<strong id="sd">-</strong>
</div>


<div>
CV
<strong id="cv">-</strong>
</div>


<div>
یکنواختی ±10%
<strong id="u10">-</strong>
</div>


<div>
یکنواختی ±15%
<strong id="u15">-</strong>
</div>


</div>


</div>






<div class="card">

<h2>
نمودار توزیع وزن جوجه
</h2>

<canvas id="weightChart"></canvas>

</div>






<div class="card">

<h2>
نمودار خطی CV
</h2>

<canvas id="cvChart"></canvas>

</div>






</div>




<script src="Script.js"></script>


</body>

</html>
