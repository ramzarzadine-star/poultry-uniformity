<main class="container">


<div class="card">

<h2>
ثبت مصرف آب
</h2>


<select id="flockId"></select>


<div class="form-grid">

<input id="date" type="date">

<input
id="amount"
type="number"
step="0.1"
placeholder="مصرف آب (لیتر)"
>

<input
id="birds"
type="number"
placeholder="تعداد پرنده زنده"
>

<input
id="age"
type="number"
placeholder="سن گله (روز)"
>

</div>


<div class="actions">

<button onclick="saveWater()">
ثبت
</button>

</div>

</div>


<div class="card">

<h2>
سوابق مصرف آب
</h2>

<div id="list"></div>

</div>


</main>


<script src="database.js"></script>

<script src="app.js"></script>


<script>

function render(){

fillFlockSelect("flockId");

const data=
read("water",[])
.slice()
.reverse();

const list=
document.getElementById("list");


if(!data.length){

list.innerHTML=
"هنوز اطلاعاتی ثبت نشده است.";

return;

}


list.innerHTML=data.map(

function(item){

return `

<div class="list-item">

📅 ${escapeHTML(item.date)}

|

${fmt(item.amount,1)}
لیتر

|

${fmt(item.birds,0)}
پرنده

|

<b>
${fmt(item.perBird,2)}
ml/پرنده
</b>

</div>

`;

}

).join("");

}


function saveWater(){

if(!requireUser()){

return;

}


const flockId=
document.getElementById("flockId").value;


const amount=
num(document.getElementById("amount").value);


const birds=
num(document.getElementById("birds").value);


if(!flockId || amount<=0 || birds<=0){

alert(
"گله، مقدار آب و تعداد پرنده را صحیح وارد کنید."
);

return;

}


addRecord(

"water",

{

flockId:flockId,

date:
document.getElementById("date").value ||
todayISO(),

amount:amount,

birds:birds,

age:
num(document.getElementById("age").value),

perBird:
amount*1000/birds

}

);


render();

}


document.addEventListener(

"DOMContentLoaded",

function(){

document.getElementById("date").value=todayISO();

render();

}

);

</script>

</body>

</html>
